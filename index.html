<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress unhandled errors from injected third-party browser extensions (e.g. MetaMask, web3 wallets)
      (function() {
        var isExtensionError = function(msg, source) {
          if (!msg && !source) return false;
          var str = (String(msg) + ' ' + String(source)).toLowerCase();
          return (
            str.indexOf('metamask') !== -1 ||
            str.indexOf('ethereum') !== -1 ||
            str.indexOf('chrome.runtime') !== -1 ||
            str.indexOf('extension context invalidated') !== -1 ||
            str.indexOf('failed to connect to metamask') !== -1 ||
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('moz-extension://') !== -1
          );
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && (event.reason || event.detail);
          var msg = (typeof reason === 'string' ? reason : (reason && reason.message) || '') + '';
          var stack = (reason && reason.stack) || '';
          if (isExtensionError(msg, stack)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = (event && event.message) || '';
          var filename = (event && event.filename) || '';
          if (isExtensionError(msg, filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
